version: 2
updates:
  # Une seule PR par mois, toutes mises à jour npm regroupées : le dépôt reste
  # calme, et la procédure de validation est décrite dans le README (§ Mises à jour).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns:
          - "*"
